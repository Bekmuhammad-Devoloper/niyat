# Niyat landing — niyat.tech (statik sahifa, /opt/niyat/landing)
# DIQQAT: default_server QO'YILMAYDI — bu ko'p loyihali server.
# SSL: DNS ko'chgach `bash /opt/niyat/go-live.sh` (certbot niyat.tech + www).

server {
    listen 80;
    server_name niyat.tech www.niyat.tech;
    root /opt/niyat/landing;
    index index.html;

    # Qisqa havola: niyat.tech/apk -> GitHub Release'dagi oxirgi APK
    location = /apk {
        return 302 https://github.com/Bekmuhammad-Devoloper/niyat/releases/latest/download/niyat.apk;
    }
    location = /download { return 302 /apk; }

    # Ilovaning o'zi — my.niyat.tech
    location = /app { return 302 https://my.niyat.tech/; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }
    location ~* \.(png|svg|jpg|webp|ico)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
