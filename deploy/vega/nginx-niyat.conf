# Niyat — my.niyat.tech -> 127.0.0.1:2410 (pm2 `niyat`, wrangler dev)
# DIQQAT: default_server QO'YILMAYDI — bu ko'p loyihali server.
# SSL: DNS 62.171.184.14 ga ko'chgach `bash /opt/niyat/go-live.sh` (certbot).

server {
    listen 80;
    server_name my.niyat.tech;
    client_max_body_size 25m;   # STT audio yuklash (native AAC/webm)

    location / {
        proxy_pass http://127.0.0.1:2410;
        include snippets/vega-proxy.conf;
        # /api/coach SSE (stream) — bufer bo'lsa matn bo'lak-bo'lak kelmaydi
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
